[project]
name = "melodia"
version = "0.1.0"
description = "Personal AI music agent that understands why you like a song"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
melodia = "melodia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
